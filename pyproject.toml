[project]
name = "clinical-friction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.2",
    "loguru>=0.7.3",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "streamlit[auth]>=1.57.0",
    "streamlit-sortables>=0.3.1",
    "waitress>=3.0.2",
    "authlib==1.3.2",
    "httpx>=0.28.1",
    "dotenv>=0.9.9",
    "streamlit-survey>=1.1.0",
    "statsmodels>=0.15.0",
    "scikit-learn>=1.9.0",
    "matplotlib>=3.11.1",
    "pingouin>=0.6.1",
    "seaborn>=0.13.2",
    "fairseq-signals @ git+https://github.com/Jwoo5/fairseq-signals@f8f0ff1",
    "ecg-transform==0.1.3",
    "tqdm>=4.70.0",
    "h5py>=3.16.0",
    "wfdb>=4.3.1",
    "tslearn>=0.9.0",
    "huggingface-hub>=1.30.0",
    "psycopg2-binary>=2.9.12",
    "tensorflow>=2.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_friction"]

[tool.hatch.build.targets.wheel.force-include]
"src/clinical_friction/database/create_db.sql" = "clinical_friction/database/create_db.sql"


[tool.hatch.metadata]
allow-direct-references = true

[project.scripts]
clinical-friction-init-db = "clinical_friction.initialize:initialize_database"
clinical-friction-init-similarity = "clinical_friction.initialize_similarity:main"
clinical-friction-init-support = "clinical_friction.initialize_support:main"
